app = 'sentinel-holy-rain-4562'
primary_region = 'sjc'

[build]
dockerfile = 'Dockerfile'

[env]
PYTHONUNBUFFERED = 'true'

[http_service]
internal_port = 8000
force_https = false
auto_stop_machines = false
auto_start_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = '90s'
interval = '15s'
method = 'GET'
timeout = '5s'
path = '/api/health'

[[processes]]
type = 'app'
cmd = 'python -m uvicorn main:app --host 0.0.0.0 --port 8000'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
