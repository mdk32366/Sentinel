# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Test frontend auth
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: treasury_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/treasury_monitor
      # F-0009: auth_password has no default, so the app refuses to start
      # without it. These are throwaway values for the ephemeral CI container,
      # never a real credential - the deployed password is the Fly secret.
      AUTH_USERNAME: ci
      AUTH_PASSWORD: ci-not-a-real-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize database schema
        run: python -c "from database.connection import init_db; init_db()"
      # ORDER-01 A5 / F-0006: discovery, not a hand-maintained list. Two test
      # files sat outside the gate for weeks and read as coverage. A new test
      # is now in the gate by default rather than by memory.
      # F-0053: the frontend had no tests at all, so nothing could catch a
      # regression in the 2,583-line App.jsx or the modules pulled out of it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui
      - name: Run frontend tests
        run: npm test
        working-directory: ui
      - name: Build the frontend
        run: npm run build
        working-directory: ui

      - name: Run the test suite
        # -t . matters: without it discovery imports the test modules as
        # top-level names, tests/__init__.py never runs, and the Step 12
        # guard is never armed. test_disposable_guard fails loudly if that
        # happens, so this cannot regress silently.
        run: python -m unittest discover -t . -s tests -p "test_*.py" -v

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
